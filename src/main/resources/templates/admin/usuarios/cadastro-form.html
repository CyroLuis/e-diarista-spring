<!DOCTYPE html>
<html th:replace="~{adminlte3 :: layout (~{::title}, ~{::content}, ~{::styles},_)}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title th:fragment="title">Cadastro Usuário</title>

    <th:block th:fragment="styles"></th:block>
</head>
<body>

<main th:fragment="content">
    <div class="row">
        <div class="col">
            <div class="card card-primary">
                <div class="card-header">
                    <div class="card-title">Cadastro Usuário</div>
                </div>
                <div class="card-body">
                    <form method="post" th:object="${cadastroForm}">
                        <div class="row">
                            <div class="col">
                                <div class="form-group">
                                    <label>Nome Completo</label>
                                    <input type="text" class="form-control" th:field="*{nomeCompleto}">
                                    <ul>
                                        <li class="text-danger" th:each="erro : ${#fields.errors('nomeCompleto')}" th:text="${erro}"></li>
                                    </ul>
                                </div>
                            </div>

                        </div>

                        <div class="row">
                            <div class="col">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" class="form-control" th:field="*{email}">
                                    <ul>
                                        <li class="text-danger" th:each="erro : ${#fields.errors('email')}" th:text="${erro}"></li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 col-sm-12">
                                <div class="form-group">
                                    <label>Senha</label>
                                    <input type="password" class="form-control" th:field="*{senha}">
                                    <ul>
                                        <li class="text-danger" th:each="erro : ${#fields.errors('senha')}" th:text="${erro}"></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12">
                                <div class="form-group">
                                    <label>Confirmação de Senha</label>
                                    <input type="password" class="form-control" th:field="*{confirmacaoSenha}">
                                    <ul>
                                        <li class="text-danger" th:each="erro : ${#fields.errors('confirmacaoSenha')}" th:text="${erro}"></li>
                                    </ul>
                                </div>
                            </div>
                        </div>



                        <button type="submit" class="btn btn-success">Salvar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
